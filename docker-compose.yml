# Окружение для лабы: Airflow (оркестрация) + Postgres (хранилище de) + Metabase (дашборды)
#
# Запуск:   docker compose up -d
# Airflow:  http://localhost:8080   (admin / admin)
# Metabase: http://localhost:3333   (при первом входе зарегистрироваться;
#           подключение к БД: host=warehouse, port=5432, db=de, user/pass=jovyan)
# БД с компа (DBeaver/psql): localhost:15432, db=de, jovyan / jovyan

x-airflow-common: &airflow-common
  image: apache/airflow:2.10.5-python3.11
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-db:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    # DAG'и включаются сразу после старта — сбор данных начинается без ручных кликов
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "false"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: utc
    AIRFLOW__WEBSERVER__SECRET_KEY: ppad-weather-lab
    # Подключение к хранилищу создаётся из переменной окружения — в UI ничего настраивать не нужно
    AIRFLOW_CONN_PG_WAREHOUSE: postgresql://jovyan:jovyan@warehouse:5432/de
  volumes:
    - ./dags:/opt/airflow/dags
    - ./sql:/opt/airflow/sql
    - airflow-logs:/opt/airflow/logs
  depends_on: &airflow-depends
    airflow-db:
      condition: service_healthy
    warehouse:
      condition: service_healthy

services:
  # Служебная БД самого Airflow (метаданные DAG'ов, запуски и т.п.)
  airflow-db:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Хранилище данных: схемы stg / dds / cdm
  warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: jovyan
      POSTGRES_PASSWORD: jovyan
      POSTGRES_DB: de
    ports:
      - "15432:5432"
    volumes:
      - warehouse-data:/var/lib/postgresql/data
      # Скрипты отсюда выполняются один раз — при первом создании пустой БД
      - ./sql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "jovyan", "-d", "de"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  # Разовая инициализация Airflow: миграция БД и создание пользователя admin
  airflow-init:
    <<: *airflow-common
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: admin
      _AIRFLOW_WWW_USER_PASSWORD: admin
    command: version
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8080:8080"
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    depends_on:
      <<: *airflow-depends
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  metabase:
    image: metabase/metabase:latest
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    ports:
      - "3333:3000"
    volumes:
      - metabase-data:/metabase-data
    depends_on:
      warehouse:
        condition: service_healthy
    restart: unless-stopped

volumes:
  airflow-db-data:
  warehouse-data:
  metabase-data:
  airflow-logs:
